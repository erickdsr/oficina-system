services:
  postgres:
    image: postgres:17-alpine
    container_name: system_oficina-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: system_oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d system_oficina"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: system_oficina-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/system_oficina
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      JWT_SECRET: dev-secret-change-me-dev-secret-change-me-dev-secret-change-me
      JWT_EXPIRATION: 86400000
      ADMIN_EMAIL: admin@systemoficina.local
      ADMIN_PASSWORD: admin123
      ADMIN_NAME: Administrador
      ADMIN_PHONE: "11999999999"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - maven_cache:/root/.m2

    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src

        - action: rebuild
          path: ./backend/pom.xml

        - action: rebuild
          path: ./backend/Dockerfile.dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    container_name: system_oficina-frontend
    restart: unless-stopped

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    ports:
      - "3000:5173"

    depends_on:
      - backend

    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

        - action: sync
          path: ./frontend/public
          target: /app/public

        - action: sync
          path: ./frontend/index.html
          target: /app/index.html

        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts

        - action: rebuild
          path: ./frontend/package.json

        - action: rebuild
          path: ./frontend/package-lock.json

        - action: rebuild
          path: ./frontend/Dockerfile.dev

volumes:
  postgres_data:
  maven_cache:
