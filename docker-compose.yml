services:
  postgres:
    image: postgres:17-alpine
    container_name: system_oficina-postgres

    environment:
      POSTGRES_DB: system_oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d system_oficina"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - system_oficina-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: system_oficina-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/system_oficina
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_PHONE: ${ADMIN_PHONE:-11999999999}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - system_oficina-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: system_oficina-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - system_oficina-network


volumes:
  postgres_data:


networks:
  system_oficina-network:
    driver: bridge
